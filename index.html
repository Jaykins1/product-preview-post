<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Post</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Fraunces:wght@100..900&display=swap" rel="stylesheet">
</head>
<body class="flex justify-center items-center min-h-screen bg-[#F2E9DC]">
    <main class="w-[90%] sm:w-[600px] grid grid-cols-1 sm:grid-cols-2 bg-white rounded-lg shadow-lg overflow-hidden">
        <!-- Image -->
        <picture>
            <source media="(min-width: 640px)" srcset="./images/image-product-desktop.jpg">
            <img src="./images/image-product-desktop.jpg" alt="Perfume bottle" class="w-full h-full object-cover">
        </picture>

        <!-- Description -->
        <div class="p-6 flex flex-col justify-between">
            <h3 class="font-[montserrat] text-[0.875rem] font-medium text-[#6C7289] uppercase tracking-[5px]">Perfume</h3>
            <h1 class="font-[fraunces] text-[2em] mt-2.5 leading-[1] font-bold text-[#1C232B]">
                Gabrielle Essence Eau De Parfum
            </h1>
            <p class="font-[montserrat] text-[0.875rem] my-3 leading-[1.5] font-medium text-[#6C7289]">
                A floral, solar and voluptuous interpretation composed by Olivier Polge, 
                Perfumer-Creator for the House of CHANEL.
            </p>

            <div class="price flex items-center gap-4">
                <span class="new-price font-[fraunces] text-[2em] font-bold text-[#3C8067]">$149.99</span>
                <span class="old-price font-[montserrat] text-[0.875rem] font-medium text-[#6C7289]"><del>$169.99</del></span>
            </div>

            <button class="flex w-full items-center justify-center gap-2 transition-all duration-300 hover:bg-green-900 bg-green-700 text-white font-[montserrat] text-[1em] font-medium rounded-lg p-4 mt-5 cursor-pointer">
                <img src="./images/icon-cart.svg" alt="Cart icon">
                Add to Cart
            </button>
        </div>

    </main>
</body>
</html>
